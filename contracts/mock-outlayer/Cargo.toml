[package]
name = "proven-mock-outlayer"
version = "0.1.0"
edition = "2021"
description = "Test double of the OutLayer contract, used only by Proven's escrow sandbox tests"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
