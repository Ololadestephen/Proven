[package]
name = "proven-pr-probe"
version = "0.1.0"
edition = "2021"
description = "Testnet probe: reads one pull request through OutLayer's GitHub connector and records what its own callback received. It holds no bounty money"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30", features = ["deterministic-account-ids"] }

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
near-workspaces = "0.24"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
