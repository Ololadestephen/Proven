[package]
name = "proven-vault-test-actor"
version = "0.1.0"
edition = "2021"
description = "Sandbox helper for the PR bounty vault tests: sends the global-contract, NEP-616 and account actions near-workspaces cannot send itself"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30", features = ["deterministic-account-ids"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
