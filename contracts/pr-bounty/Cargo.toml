[package]
name = "proven-pr-bounty"
version = "0.1.0"
edition = "2021"
description = "Proven PR merge bounties: pays a claimed contributor in NEAR after an attested GitHub merge check of a nominated pull request"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Test builds only. The first makes the transfer bookkeeping callback fail, to show recovery from
# the separately recorded outcome; with the second as well, both callbacks fail, to show that
# nothing is ever resent without an outcome.
fault-transfer-callback = []
fault-outcome-callback = []

[dependencies]
near-sdk = { version = "5.30", features = ["deterministic-account-ids"] }

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
near-workspaces = "0.24"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "=0.12.28", default-features = false, features = ["json"] }
proven-pr-bounty-verifier = { path = "../../pr-bounty-verifier" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
