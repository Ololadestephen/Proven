[package]
name = "proven-test-token"
version = "0.1.0"
edition = "2021"
description = "Test-only NEP-141 token (Proven Test USD) used for Proven's sandbox tests and testnet demo. It has no value."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
