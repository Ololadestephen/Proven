[package]
name = "proven-proto-harness"
version = "0.2.0"
edition = "2021"
description = "near-workspaces sandbox tests of the NEP-616 vault settlement prototype"
license = "MIT"
publish = false

[dev-dependencies]
near-workspaces = "0.24"
near-global-contracts = { version = "~0.3.3", features = ["borsh"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "=0.12.28", default-features = false, features = ["json"] }
sha2 = "0.10"
bs58 = "0.5"
base64 = "0.22"
ed25519-dalek = "2"
