[package]
name = "proven-proto-vault"
version = "0.2.0"
edition = "2021"
description = "Prototype NEP-616 vault bound to an ed25519 key: durable settlement records and NEP-413 signed withdrawals"
license = "MIT"
publish = false

# No dependencies: raw host functions only, to keep the global contract small.
[lib]
crate-type = ["cdylib"]
